name: ListenSDR

options:
  minimumXcodeGenVersion: 2.38.0

packages:
  ListenSDRCore:
    path: ../shared/ListenSDRCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 11.15.0

targets:
  ListenSDR:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    scheme:
      testTargets:
        - ListenSDRTests
    sources:
      - path: ListenSDR/Sources
      - path: ListenSDR/Resources
    dependencies:
      - package: ListenSDRCore
        product: ListenSDRCore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
    info:
      path: ListenSDR/Info.plist
      properties:
        CFBundleDisplayName: Listen SDR
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "107"
        FirebaseCrashlyticsCollectionEnabled: false
        ITSAppUsesNonExemptEncryption: false
        ListenSDRFirebaseCrashlyticsEnabled: $(LISTENSDR_FIREBASE_CRASHLYTICS_ENABLED)
        ListenSDRFirebaseRemoteConfigEnabled: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazek.sdr
        CURRENT_PROJECT_VERSION: 107
        MARKETING_VERSION: 1.0.1
        SWIFT_VERSION: 5.10
        LISTENSDR_CRASHLYTICS_UPLOAD_SYMBOLS: "NO"
        LISTENSDR_FIREBASE_CRASHLYTICS_ENABLED: "false"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ListenSDR/ListenSDR.entitlements
      configs:
        Release:
          LISTENSDR_CRASHLYTICS_UPLOAD_SYMBOLS: "YES"
          LISTENSDR_FIREBASE_CRASHLYTICS_ENABLED: "true"
    postBuildScripts:
      - name: Upload Crashlytics dSYMs
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)"
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)"
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
        script: |
          set -euo pipefail

          if [ "${LISTENSDR_CRASHLYTICS_UPLOAD_SYMBOLS:-NO}" != "YES" ]; then
            echo "Crashlytics dSYM upload disabled for this build."
            exit 0
          fi

          if [ "${CONFIGURATION:-}" != "Release" ]; then
            echo "Crashlytics dSYM upload is only enabled for Release."
            exit 0
          fi

          GOOGLE_SERVICE_INFO="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ ! -f "$GOOGLE_SERVICE_INFO" ]; then
            echo "GoogleService-Info.plist not bundled; skipping Crashlytics dSYM upload."
            exit 0
          fi

          CRASHLYTICS_RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ ! -x "$CRASHLYTICS_RUN" ]; then
            echo "Crashlytics run script not found: $CRASHLYTICS_RUN" >&2
            exit 1
          fi

          "$CRASHLYTICS_RUN"
  ListenSDRTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ListenSDRTests
    dependencies:
      - target: ListenSDR
      - package: ListenSDRCore
        product: ListenSDRCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kazek.sdr.tests
        SWIFT_VERSION: 5.10
